version: 2
project_name: gitvm
builds:
  - main: ./cmd/gitvm
    binary: gitvm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
release:
  github:
    owner: SergioSanchezIglesias
    name: gitvm-tui
changelog:
  use: git
